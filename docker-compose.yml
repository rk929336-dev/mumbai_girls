services:
  postgres:
    image: postgres:16-alpine
    container_name: mumbai-directory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mumbai_directory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - mumbai_directory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mumbai_directory"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mumbai-directory-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mumbai_directory_redisdata:/data

volumes:
  mumbai_directory_pgdata:
  mumbai_directory_redisdata:
