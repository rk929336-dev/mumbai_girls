# Example TLS virtual host. Terminate TLS here, then proxy to the private Next.js port.
# Replace certificate paths and hostname; configure a trusted proxy/CDN explicitly.
limit_req_zone $binary_remote_addr zone=site_rate:10m rate=20r/s;

server {
    listen 80;
    server_name mumbaigirlescort.in www.mumbaigirlescort.in;
    return 301 https://mumbaigirlescort.in$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mumbaigirlescort.in;
    ssl_certificate /etc/letsencrypt/live/mumbaigirlescort.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mumbaigirlescort.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    limit_req zone=site_rate burst=40 nodelay;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }
}
